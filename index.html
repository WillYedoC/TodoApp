<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>TodoApp</title>
</head>

<body>
    <main class="todo-app">
        <header class="todo-app__header">
            <h1 class="todo-app__title">Lista de Tareas</h1>
        </header>
        <section class="todo-app__section">
            <form action="#" class="todo-app__form">
                <div class="todo-app__field">
                    <label class="todo-app__label" for="todo-title">Titulo: </label>
                    <input class="todo-app__input" type="text" id="todo-title" name="title">
                    <span id="title-error" class="todo-app__error" style="display: none;">El título es obligatorio</span>
                </div>
                <div class="todo-app__field">
                    <label class="todo-app__label" for="todo-description">Descripcion: </label>
                    <textarea class="todo-app__textarea" name="description" id="todo-description" cols="30"
                        rows="10"></textarea>
                </div>
                <button class="todo-app__button" type="submit">Agregar Tarea</button>
            </form>
        </section>
        <section class="todo-app__section">
            <h2 class="todo-app__subtitle">Lista de Tareas</h2>
            <div class="todo-app__list">

            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="task-modal" class="modal">
        <div class="modal__content">
            <div class="modal__header">
                <h2 id="modal-title" class="modal__title"></h2>
                <button id="modal-close" class="modal__close">&times;</button>
            </div>
            <div class="modal__body">
                <div class="modal__form">
                    <div class="modal__field">
                        <label class="modal__label" for="modal-title-input">Título:</label>
                        <input type="text" id="modal-title-input" class="modal__input" placeholder="Ingrese el título" disabled required>
                        <span id="modal-title-error" class="modal__error" style="display: none;">El título es obligatorio</span>
                    </div>
                    <div class="modal__field">
                        <label class="modal__label" for="modal-description-input">Descripción:</label>
                        <textarea id="modal-description-input" class="modal__textarea"
                            placeholder="Ingrese la descripción" rows="6" disabled></textarea>
                    </div>
                    <div class="modal__field">
                        <label class="modal__label">
                            <input type="checkbox" id="modal-completed-input" class="modal__checkbox" disabled>
                            Marcar como completada
                        </label>
                    </div>
                    <div class="modal__actions">
                        <button id="modal-edit-btn" class="modal__button modal__button--edit">Editar</button>
                        <button id="modal-save" class="modal__button modal__button--save" style="display: none;">Guardar Cambios</button>
                        <button id="modal-cancel" class="modal__button modal__button--cancel" style="display: none;">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
